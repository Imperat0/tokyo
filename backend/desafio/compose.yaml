services:
  postgres:
    image: postgres:17-alpine
    container_name: fullstack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fullstack}
      POSTGRES_USER: ${DB_USER:-fullstack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fullstack}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

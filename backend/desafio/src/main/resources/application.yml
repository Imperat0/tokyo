spring:
  application:
    name: fullstack

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fullstack}
    username: ${DB_USER:fullstack}
    password: ${DB_PASSWORD:fullstack}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never      # o GlobalExceptionHandler controla as mensagens

# ---------- Configurações da aplicação ----------
app:
  jwt:
    # HS256 exige chave com no mínimo 32 caracteres. Troque em produção via variável de ambiente.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: fullstack-api

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

  auth:
    cookie:
      name: ACCESS_TOKEN
      secure: false
      same-site: Lax

  admin:
    # Usuário ADMIN criado pelo AdminSeeder se ainda não existir
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:admin@teste.com}
    password: ${ADMIN_PASSWORD:Admin@123}

  viacep:
    base-url: ${VIACEP_BASE_URL:https://viacep.com.br/ws}
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

# ---------- Documentação e observabilidade ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.teste.fullstack: INFO
